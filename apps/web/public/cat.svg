  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ears -->
  <path d="M130 205 L145 90 L225 165 Z" fill="#f9a8d4"/>
  <path d="M382 205 L367 90 L287 165 Z" fill="#f9a8d4"/>

