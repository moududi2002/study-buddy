  <path d="M150 305 L60 310" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M362 285 L447 265" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M362 305 L452 310" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

